name: formfit_app
description: FormFit AI 健身私教 App
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络
  dio: ^5.7.0

  # 状态管理 / 路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # 本地存储
  shared_preferences: ^2.3.4

  # 图片选择/拍照
  image_picker: ^1.1.2
  # image_picker 返回的跨平台文件抽象（XFile），API 层直接依赖以解耦 picker
  cross_file: ^0.3.4+2

  # Apple 内购（iOS/macOS）
  in_app_purchase: ^3.2.0

  # GIF / 网络图缓存
  cached_network_image: ^3.4.1

  # 工具
  intl: ^0.19.0
  flutter_svg: ^2.0.16

  # 字体
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  glassmorphism: ^3.0.0
  particles_network: ^1.9.5

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
