{% extends "admin/base.html" %}
{% block title %}登录 · FormFit{% endblock %}
{% block anon %}
<div class="login-wrap">
  <div class="login-card">
    <div class="header-brand">{{ icon('dumbbell', 20) }} FormFit</div>
    <div class="brand-sub">Operations Console</div>
    {% if error %}<div class="login-error">{{ icon('stop') }} {{ error }}</div>{% endif %}
    <form method="post" action="/admin/login">
      <div class="field">
        <label for="email">管理员邮箱</label>
        <input id="email" name="email" type="email" required autofocus
               value="{{ 'admin@formfit.local' if not error else '' }}" placeholder="admin@example.com">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit">{{ icon('check') }} 进入控制台</button>
    </form>
  </div>
</div>
{% endblock %}
{% block content %}{% endblock %}
