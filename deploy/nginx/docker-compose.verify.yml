# 本地验证用 compose（独立、临时，勿用于生产）。
#
# 用法（仓库根目录执行）：
#   cd formfit_app && flutter build web --release --dart-define=API_BASE_URL= && cd ..
#   docker compose -f deploy/nginx/docker-compose.verify.yml up -d --build
#   # ... 跑 docs/deployment/web-release.md 第 7 节的 curl 验证（端口 127.0.0.1:8080）...
#   docker compose -f deploy/nginx/docker-compose.verify.yml down
#
# 它只起两个容器：mock 后端（stdlib，模拟 /healthz、/api、/media、/static、上传回显）
# 与 nginx（加载 verify 配置），用于验证路由顺序/SPA fallback/反代/上传体积，
# 无需真实密钥、数据库或构建后端镜像。

services:
  formfit:
    image: python:3.13-slim
    command: ["python", "/mock/mock_backend.py"]
    volumes:
      - ./verify/mock_backend.py:/mock/mock_backend.py:ro
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - formfit
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./verify/formfit-web.verify.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../formfit_app/build/web:/usr/share/nginx/html:ro
    restart: "no"
