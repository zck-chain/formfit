# FormFit 安全响应头片段——在每个自带 add_header 的 location 里 include 一次。
#
# 背景：nginx 的 add_header 指令在「当前级别是否有 add_header」上有继承陷阱——
# 只要某个 location 里出现了任意一条 add_header（比如我们给静态资源设的
# Cache-Control），server 级的 add_header 就会被整体丢弃，导致该 location 的响应
# 没有 HSTS / X-Frame-Options 等。把安全头集中在这个片段里，在 server 级和每个
# 设了 Cache-Control 的 location 各 include 一次，即可保证两类头同时存在。
#
# 部署位置（相对 nginx --prefix 下的 snippets/）：
#   - 官方 nginx 镜像：/etc/nginx/snippets/formfit-security-headers.conf
#   - 1Panel OpenResty：<openresty-conf>/snippets/formfit-security-headers.conf
# 若不想用 include，也可把下面 4 行直接内联到 server 与相关 location（内容保持一致）。

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP（内容安全策略）留待 W6-1 认证硬化统一处理：应用依赖 google_fonts，运行时可能拉
# fonts.googleapis.com / fonts.gstatic.com，过严会挡字体；届时切 Cookie 后一起评审。
# 草拟基线（边测边收紧，放开前不要直接启用）：
