# FormFit v1 同源 Nginx 配置（Flutter Web 静态 + FastAPI 反代）。
#
# 形态：同一域名下，/api、/admin、/media、/static、/healthz 反代到单 worker FastAPI
# （容器仅绑 127.0.0.1:8000，见 docker-compose.yml）；其余路径由 Flutter Web
# 产物提供，SPA 深链回退到 /index.html。
#
# 用法（1Panel「网站 → 反向代理/配置」或独立 nginx）：
#   1. 把 <upstream_port> 替换为后端端口（默认 8000），<server_name> 替换为域名。
#   2. 把 snippets/formfit-security-headers.conf 放到 nginx prefix 下的 snippets/ 目录：
#        官方镜像:  /etc/nginx/snippets/formfit-security-headers.conf
#        1Panel:    <openresty-conf>/snippets/formfit-security-headers.conf
#      （不想用 include 可把该片段 4 行 add_header 内联到 server 与相关 location）。
#   3. web_root 指向当前发布的 Flutter Web 产物软链：
#        /opt/formfit/web/current -> releases/web-<sha>
#      （发布/回滚只切软链再 nginx -s reload，见 docs/deployment/web-release.md）。
#   4. 证书路径按 1Panel 实际签发位置填写（本站示例 /etc/nginx/ssl/formfit）。
#   5. 校验：nginx -t，热加载：nginx -s reload。
#
# 路由顺序是评审重点：所有「反代前缀」必须写在「/ 静态 + SPA fallback」之前，
# 否则 /api、/admin 等会被 try_files 的 /index.html 吞掉返回 200(HTML)。

# ---- 上游：本机单 worker FastAPI（与 docker-compose.yml 暴露端口一致）----
# 仅绑 127.0.0.1，不暴露公网；如需改端口只改这一处。
upstream formfit_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP：全部 301 跳转到 HTTPS（含 / 与任意路径），不在 80 提供任何内容。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 保留 ACME http-01 续期通道（1Panel/Let's Encrypt 会写 .well-known）。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;   # TODO: 替换为真实域名（W7-1 门禁提供）

    # ---- TLS（路径按 1Panel 证书实际位置）----
    ssl_certificate     /etc/nginx/ssl/formfit/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/formfit/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 安全响应头 ----
    # HSTS / X-Content-Type-Options / X-Frame-Options / Referrer-Policy 集中在
    # snippets 片段里。注意：凡是本文件里自带 add_header（如静态资源 Cache-Control）
    # 的 location，都必须再 include 一次该片段，否则 nginx 的 add_header 继承规则
    # 会让该 location 的安全头被整体丢弃（见 snippets/formfit-security-headers.conf 说明）。
    # CSP 留待 W6-1 认证硬化统一处理（google_fonts 需要边测边收紧）。
    include snippets/formfit-security-headers.conf;

    # Flutter Web 当前发布产物根（软链到 releases/web-<sha>，切换即回滚）。
    set $web_root /opt/formfit/web/current;
    root $web_root;
    index index.html;

    # 与后端 UPLOAD_MAX_BYTES（默认 10MB）对齐；留 2MB 余量给 multipart 边界，
    # 与 1panel.md 中 client_max_body_size 12m 一致。注意：后端还会做二次校验。
    client_max_body_size 12m;

    # gzip：文本类资源压缩（wasm/图片已压缩，不重复压）。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/dart image/svg+xml;

    # brotli（压缩率优于 gzip）。标准 nginx 镜像不含 brotli 模块，直接写 brotli 指令会让
    # nginx -t 报 "unknown directive"；1Panel 用的 OpenResty 通常内置 brotli。
    # 若你的 nginx 有 ngx_brotli（OpenResty / 自编译带 brotli），取消下面 4 行注释；
    # 否则保持注释，仅用 gzip 也满足压缩需求。
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json
    #              application/wasm application/dart image/svg+xml;

    # ============================================================
    # 反代区（必须在 / 静态区之前）：/api、/media、/static、/healthz
    # ============================================================

    # /api/ —— 业务接口。
    location ^~ /api/ {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /media/ —— 数据集只读素材（动作 GIF/JPG/视频），由 FastAPI StaticFiles 提供。
    location ^~ /media/ {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 只读素材体积较大，给更长的读超时。
        proxy_read_timeout 120s;
    }

    # /static/ —— 后台自带静态资源 + 用户上传（/static/uploads，FastAPI 子挂载）。
    # 上传写请求走 POST，必须反代；不能用静态目录直接服务（上传落在后端持久卷）。
    location ^~ /static/ {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # /admin —— 后端运营后台（Jinja2 页面 + 表单写操作：登录、发放/收回 PRO、
    # 启停用户等）。后台路由挂在根路径 /admin/*，不在 /api 下（见 app/main.py
    # include_router(admin.router)），所以必须单独反代；若漏掉会落到静态区被
    # SPA fallback 返回 index.html，后台打不开、表单 POST 返回 405。
    # 用 ^~ /admin（不带尾斜杠）同时命中 /admin、/admin/login、
    # /admin/membership/{id}/revoke 等；proxy_pass 不带 URI，原样透传路径。
    location ^~ /admin {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";
        # 表单 POST（发放/收回/启停）给足超时
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /healthz —— 后端存活+数据库探活。
    # 注意：后端探针是根路径 /healthz（非 /api/healthz）。公网可仅返回 200/503，
    # 不含敏感信息；如不想暴露给公网，可改为只允许内网/本机后 return 404。
    location = /healthz {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 文档（后台/联调用；生产如需关闭，在后端设 docs_url=None 即可，
    # 这里一并反代保证同源能打开；不希望公开时整段删掉这三个 location）。
    location = /docs        { proxy_pass http://formfit_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /redoc       { proxy_pass http://formfit_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /openapi.json { proxy_pass http://formfit_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # ============================================================
    # 静态区：Flutter Web 产物（build/web）
    # ============================================================

    # 带内容哈希/随 SDK 版本化的资源：一年强缓存 + immutable。
    # - assets/  ：Flutter 打包资源（图片/字体/shader 等），经 AssetManifest 寻址，
    #              内容变更时清单文件本身会更新；
    # - canvaskit/：随 Flutter SDK 版本发布，文件名/内容随版本走。
    # 只用 add_header 显式设置 Cache-Control，不用 expires 指令（后者会再追加一个
    # Cache-Control 头，造成重复头）。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/formfit-security-headers.conf;
        try_files $uri =404;
        access_log off;
    }
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/formfit-security-headers.conf;
        try_files $uri =404;
        access_log off;
    }
    # 字体文件（woff2 已压缩）也强缓存。
    location ~* \.(?:woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/formfit-security-headers.conf;
        try_files $uri =404;
        access_log off;
    }

    # index.html 与启动引导脚本：每次都回源校验，保证新版本能被即时发现。
    # 注意 main.dart.js / flutter.js / flutter_bootstrap.js / flutter_service_worker.js
    # 不带内容哈希，绝不能 immutable（否则发版后客户端拿到旧包不更新）。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include snippets/formfit-security-headers.conf;
        try_files $uri =404;
    }
    location ~* /(?:main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|AssetManifest[^.]*\.bin(?:\.json)?|FontManifest\.json|NOTICES|manifest\.json|favicon\.png)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include snippets/formfit-security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback：深链（如 /assessment/123、/paywall）直接刷新不 404，
    # 统一回退到 index.html 由前端路由处理。
    # 因为上面所有反代前缀都用 ^~ 优先匹配，/api、/media、/static 不会落到这里。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问点文件（.git/.env 等，静态目录里本就没有，多一道保险）。
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
