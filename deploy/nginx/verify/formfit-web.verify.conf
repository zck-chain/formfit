# 本地验证用 Nginx 配置（HTTP 明文，仅用于 deploy/nginx/docker-compose.verify.yml）。
# 与 formfit-web.conf 的路由/缓存/上传规则保持一致，差异仅：
#   - 上游指向 compose 服务名 formfit:8000（容器网络内，非 127.0.0.1）；
#   - 监听 80，无 TLS/HSTS（证书相关在生产 conf 评审，本地不验）；
#   - root 指向镜像内 /usr/share/nginx/html（挂载 build/web）；
#   - 安全头在 index.html 等 location 内联（不引 snippets），用于验证 add_header
#     继承修复后静态响应仍带安全头。
# 切勿用于生产。

upstream formfit_backend {
    server formfit:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;   # 与后端 UPLOAD_MAX_BYTES(10MB) 对齐

    # 安全响应头（server 级）。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/dart image/svg+xml;

    # ---- 反代区（必须在 / 之前）----
    location ^~ /api/ {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /admin {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection "";
    }
    location ^~ /media/ {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location ^~ /static/ {
        proxy_pass http://formfit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    location = /healthz {
        proxy_pass http://formfit_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 静态区 ----
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 内联安全头，验证 add_header 继承修复（与生产 snippets include 等价）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
        access_log off;
    }
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
        access_log off;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # 关键：index.html 自带 add_header 时仍要保留安全头（add_header 继承陷阱）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    location ~* /(?:main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
